name: "Suggestion"
description: Suggest an idea, new syntax rule, or improvement for Skriptium.
title: "[Feature]: "
labels: ["feature", "idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of the syntax or feature you want added.
      placeholder: E.g., Introduce a cleaner way to handle async events like...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've thought of.
